name: Build and publish GRUB Studio Rust AppImage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4 build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config gcc libgtk-4-dev libfuse2t64
      - name: Rust tests
        run: cargo test --all-targets
      - name: Build executables
        run: cargo build --release --bins
      - name: Install linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fL --retry 3 -o "$RUNNER_TEMP/bin/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/bin/linuxdeploy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assemble experimental AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash build-appimage.sh
      - name: Verify portable executable
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          test -s GRUB-Studio-Universal-v2.0.0-x86_64.AppImage
          file GRUB-Studio-Universal-v2.0.0-x86_64.AppImage
          ./GRUB-Studio-Universal-v2.0.0-x86_64.AppImage --version
          ./GRUB-Studio-Universal-v2.0.0-x86_64.AppImage --self-test
          sha256sum GRUB-Studio-Universal-v2.0.0-x86_64.AppImage > GRUB-Studio-Universal-v2.0.0-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grub-studio-universal-v2.0.0-experimental
          path: |
            GRUB-Studio-Universal-v2.0.0-x86_64.AppImage
            GRUB-Studio-Universal-v2.0.0-SHA256.txt
      - name: Publish downloadable preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-rc.1 >/dev/null 2>&1; then
            gh release upload v2.0.0-rc.1 GRUB-Studio-Universal-v2.0.0-x86_64.AppImage GRUB-Studio-Universal-v2.0.0-SHA256.txt --clobber
          else
            gh release create v2.0.0-rc.1 GRUB-Studio-Universal-v2.0.0-x86_64.AppImage GRUB-Studio-Universal-v2.0.0-SHA256.txt --title 'GRUB Studio Universal 2.0.0 Rust — preview' --notes 'Rust/GTK4 x86_64 AppImage. CI validates the Rust tests and CLI startup. GRUB edits affect system boot; verify compatibility and create a recovery medium. Bazzite/OSTree editing is intentionally restricted.' --prerelease --target "$GITHUB_SHA"
          fi
