name: Build and publish GRUB Studio Rust AppImage
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK4 and libadwaita build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config gcc libgtk-4-dev libadwaita-1-dev libfuse2t64 xvfb xauth librsvg2-bin imagemagick xdotool
      - name: Rust tests
        run: cargo test --all-targets
      - name: Build executables
        run: cargo build --release --bins
      - name: Smoke test GTK4 interface (virtual display)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          XCURSOR_THEME: Breeze_Snow
          XCURSOR_SIZE: '32'
        run: |
          set -euo pipefail
          timeout 20s xvfb-run -a target/release/grub-studio-universal --ui-smoke | tee gtk-smoke.log
          grep -q 'GTK4 navigation smoke:' gtk-smoke.log
          grep -q 'GTK4 cursor settings: Breeze_Snow / 32' gtk-smoke.log
          timeout 20s xvfb-run -a target/release/grub-studio-universal --ui-smoke-wide | tee gtk-smoke-wide.log
          grep -q 'sidebar 196 px: OK' gtk-smoke-wide.log
          timeout 20s xvfb-run -a target/release/grub-studio-universal --ui-home-layout-smoke | tee gtk-home-layout.log
          grep -q 'GTK4 home layout smoke: 4 equally sized cards filling' gtk-home-layout.log
      - name: Exercise appearance and language preferences without freezing GTK
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          set -euo pipefail
          timeout 20s xvfb-run -a target/release/grub-studio-universal --ui-prefs-smoke | tee gtk-prefs-smoke.log
          grep -q 'GTK4 preferences smoke: 6 appearance/language changes: OK' gtk-prefs-smoke.log
      - name: Test live resize from expanded to compact navigation
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          timeout 22s xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            set -euo pipefail
            target/release/grub-studio-universal --ui-resize-report > gtk-resize.log 2>&1 &
            app_pid=$!
            sleep 2
            window_id=$(xdotool search --onlyvisible --name "GRUB Studio Universal" | tail -n 1)
            xdotool windowsize "$window_id" 720 540
            wait "$app_pid"
            grep -q "GTK4 live resize: sidebar 62 px: OK" gtk-resize.log
          '
      - name: Capture actual GTK4 dark/light theme screenshots
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          mkdir -p qa-screenshots
          xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            set -euo pipefail
            for view in home-dark home-light themes-dark themes-light menu-dark tools-dark tools-light; do
              page=${view%-*}
              mode=${view#*-}
              target/release/grub-studio-universal --demo-page="$page" --appearance="$mode" &
              app_pid=$!
              sleep 4
              window_id=$(xdotool search --onlyvisible --name "GRUB Studio Universal" | tail -n 1)
              import -window "$window_id" "qa-screenshots/$view.png"
              kill "$app_pid"
              wait "$app_pid" || true
            done
            for page in menu themes; do
              target/release/grub-studio-universal --demo-page="$page" --appearance=light --language=pl &
              app_pid=$!
              sleep 3
              window_id=$(xdotool search --onlyvisible --name "GRUB Studio Universal" | tail -n 1)
              xdotool windowsize "$window_id" 700 540
              sleep 2
              import -window "$window_id" "qa-screenshots/$page-compact-pl.png"
              kill "$app_pid"
              wait "$app_pid" || true
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: grub-studio-gtk4-screenshots
          path: qa-screenshots/*.png
      - name: Install linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fL --retry 3 -o "$RUNNER_TEMP/bin/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/bin/linuxdeploy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assemble experimental AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash build-appimage.sh
      - name: Verify portable executable
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          test -s GRUB-Studio-Universal-v3.0.2-x86_64.AppImage
          file GRUB-Studio-Universal-v3.0.2-x86_64.AppImage
          ./GRUB-Studio-Universal-v3.0.2-x86_64.AppImage --version
          ./GRUB-Studio-Universal-v3.0.2-x86_64.AppImage --self-test
          sha256sum GRUB-Studio-Universal-v3.0.2-x86_64.AppImage > GRUB-Studio-Universal-v3.0.2-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grub-studio-universal-v3.0.2-release-candidate
          path: |
            GRUB-Studio-Universal-v3.0.2-x86_64.AppImage
            GRUB-Studio-Universal-v3.0.2-SHA256.txt
      - name: Publish downloadable preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0.2-rc.1 >/dev/null 2>&1; then
            gh release upload v3.0.2-rc.1 GRUB-Studio-Universal-v3.0.2-x86_64.AppImage GRUB-Studio-Universal-v3.0.2-SHA256.txt --clobber
          else
            gh release create v3.0.2-rc.1 GRUB-Studio-Universal-v3.0.2-x86_64.AppImage GRUB-Studio-Universal-v3.0.2-SHA256.txt --title 'GRUB Studio Universal 3.0.2 — secure ZIP/TAR theme import' --notes 'Adds direct theme import from ZIP, TAR.GZ and TAR.XZ. Archives are unpacked as the unprivileged user into private temporary staging; paths, links, file types, item count, sizes and theme.txt are validated before confirmation and Polkit installation. Multiple theme.txt candidates are rejected with a clear instruction to choose an extracted folder. Scripts are never executed or installed. Theme activation remains explicit. GTK4/libadwaita window behavior is unchanged. Import and UI tests run in CI; real bootloader writes still require testing on physical hardware.' --prerelease --target "$GITHUB_SHA"
          fi
