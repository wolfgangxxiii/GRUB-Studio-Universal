[package]
name = "grub-studio-universal"
version = "2.3.8"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Wayland GRUB configuration studio with a privilege-separated helper"

[lib]
name = "grub_studio"
path = "src/lib.rs"

[[bin]]
name = "grub-studio-universal"
path = "src/main.rs"

[[bin]]
name = "grub-studio-helper"
path = "src/bin/helper.rs"

[dependencies]
gtk4 = { version = "0.10.3", features = ["v4_6"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

