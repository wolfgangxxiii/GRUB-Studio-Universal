[package]
name = "grub-studio-universal"
version = "3.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Wayland GRUB configuration studio with a privilege-separated helper"

[lib]
name = "grub_studio"
path = "src/lib.rs"

[[bin]]
name = "grub-studio-universal"
path = "src/main.rs"

[[bin]]
name = "grub-studio-helper"
path = "src/bin/helper.rs"

[dependencies]
gtk4 = { version = "0.10.3", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_5"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

